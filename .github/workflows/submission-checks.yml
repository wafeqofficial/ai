name: Submission checks

# Checks the plugin against the OpenAI and Claude directory submission rules
# that the repository files can show. No secrets: both jobs read files only.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: submission-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: OpenAI and Claude rules
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check manifests, files and images
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 .github/scripts/check_submission.py ${BASE_REF:+--base "origin/$BASE_REF"}

  claude-validate:
    name: claude plugin validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.325

      - name: Validate the plugin
        run: claude plugin validate .
