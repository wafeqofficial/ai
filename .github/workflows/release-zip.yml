name: Release zip

# Builds the OpenAI Platform upload with `make zip`, so CI and a laptop build
# the same file. Download it from the run's artifacts. The promote workflow
# calls it with the main commit it released: stable holds no Makefile.

on:
  workflow_call:
    inputs:
      ref:
        description: The main commit to build the zip from
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-zip-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  zip:
    name: Build the OpenAI upload
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Build the zip
        run: make zip

      - name: Upload the zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/*.zip
          archive: false
          if-no-files-found: error
